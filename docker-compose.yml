version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafe-kot-app
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@cafekot.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      GST_RATE: ${GST_RATE:-5}
    command: >
      sh -c "npm run db:migrate:prod && npm run db:seed:prod && npm run start:prod"

volumes:
  pgdata:
