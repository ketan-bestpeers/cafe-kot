name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Docker Compose Services
        env:
          PORT: 3000
          DB_HOST_DOCKER: db
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: cafe_kot
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: 24h
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          GST_RATE: 5
        run: |
          docker compose up --build -d

      # - name: Wait for services to be healthy
      #   run: |
      #     echo "Waiting for database and app to start..."
      #     # Poll the health endpoint of the application
      #     curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3000/health || (docker compose logs && exit 1)

      - name: Check application logs
        if: always()
        run: |
          docker compose logs

      - name: Shut down Docker Compose
        if: always()
        run: |
          docker compose down -v
